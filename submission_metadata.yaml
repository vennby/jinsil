ai_usage_summary: |
  Used Cursor implementation assistance, code review, and refactoring.
  Ranking is performed locally with deterministic Python code;
  no hosted LLM or network call is used during candidate scoring.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Hybrid offline candidate discovery system with JD understanding as the first
  step. precompute.py builds a structured interpretation of the JD: role mandate,
  must-have retrieval/ranking/embedding evidence, evaluation and production
  requirements, product/recruiter workflow context, logistics, ideal profile, and
  explicit negative signals. It then converts that JD profile into fixed
  retrieval concepts, scans the candidate corpus, computes BM25-style semantic
  relevance, derives structured fit features, and applies fixed JD-derived
  coverage weights. It does not train on candidate data. It writes
  precomputed_rank_signals.json, a 15K-candidate shortlist with semantic,
  coverage, and hybrid scores. rank.py then streams the corpus, scores only
  shortlisted candidates, and combines the hybrid signal with trusted skills,
  title fit, career evidence, evidence depth, seniority, product context,
  logistics, availability, trust, and risk penalties in a bounded top-K heap.
  Reasoning is one sentence per candidate, generated only from scored facts.
  On 100K candidates, final ranking completed in 53.2s and produced a valid
  submission.

