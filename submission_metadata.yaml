ai_usage_summary: |
  Used Cursor implementation assistance, code review, and refactoring.
  Ranking is performed locally with deterministic Python code;
  no hosted LLM or network call is used during candidate scoring.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Modular deterministic ranker in utils/ranking with rank.py as the single CLI
  entry point. The ranking step is CPU-only, no-network, streams candidates, and
  keeps only a bounded top-K heap; on 100K local candidates it completed in
  ~290s. Scoring is evidence-based rather than a flat keyword count: it combines
  trusted skill evidence, current-title fit, current-vs-historical career
  evidence, seniority, product-company context, location/logistics, Redrob
  availability, trust signals, and a JD-shaped evidence-depth score. Evidence
  depth rewards combinations of retrieval/ranking/matching systems, BM25 or
  hybrid search exposure, embeddings/vector DBs, production shipping,
  evaluation infrastructure (NDCG/MAP/A-B/offline benchmarks), recruiter/product
  workflow ownership, and mentoring/architecture signals. Penalties down-rank
  non-engineering roles, consulting-only trajectories, pure research without
  production, CV/speech/robotics mismatch, keyword stuffing, stale availability,
  and honeypot-like skill inconsistencies. Reasoning is generated directly from
  the scored facts.

